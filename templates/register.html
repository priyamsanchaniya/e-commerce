{% extends "base.html" %}
{% block title %}Sign Up - ShopSocial{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Your Account</h2>
            <p>Join ShopSocial and start group shopping! 🎉</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" id="registerForm">
            <div class="form-group">
                <label>Full Name <span class="req">*</span></label>
                <input type="text" name="full_name" value="{{ full_name or '' }}"
                       placeholder="e.g. Priya Sharma" required>
            </div>

            <div class="form-group">
                <label>Email Address <span class="req">*</span></label>
                <input type="email" name="email" value="{{ email or '' }}"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" value="{{ phone or '' }}"
                       placeholder="10 digit mobile number" maxlength="10">
            </div>

            <div class="form-group">
                <label>Password <span class="req">*</span></label>
                <input type="password" name="password" id="password"
                       placeholder="Minimum 6 characters" required>
                <div class="strength-bar"><div id="strengthFill"></div></div>
                <small id="strengthText"></small>
            </div>

            <div class="form-group">
                <label>Confirm Password <span class="req">*</span></label>
                <input type="password" name="confirm_password" id="confirmPassword"
                       placeholder="Re-enter your password" required>
                <small id="matchText"></small>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const pw = document.getElementById('password');
const cpw = document.getElementById('confirmPassword');
const fill = document.getElementById('strengthFill');
const stext = document.getElementById('strengthText');
const mtext = document.getElementById('matchText');

pw.addEventListener('input', () => {
    const v = pw.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const levels = [
        {w: '0%',   c: '#eee',    t: ''},
        {w: '25%',  c: '#e74c3c', t: 'Weak password'},
        {w: '50%',  c: '#e67e22', t: 'Fair password'},
        {w: '75%',  c: '#f1c40f', t: 'Good password'},
        {w: '100%', c: '#27ae60', t: 'Strong password 💪'},
        {w: '100%', c: '#27ae60', t: 'Very strong 🔒'}
    ];
    fill.style.width = levels[score].w;
    fill.style.background = levels[score].c;
    stext.textContent = levels[score].t;
    stext.style.color = levels[score].c;
});

cpw.addEventListener('input', () => {
    if (cpw.value === '') { mtext.textContent = ''; return; }
    if (cpw.value === pw.value) {
        mtext.textContent = '✓ Passwords match';
        mtext.style.color = '#27ae60';
    } else {
        mtext.textContent = '✗ Passwords do not match';
        mtext.style.color = '#e74c3c';
    }
});
</script>
{% endblock %}
